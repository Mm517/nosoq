<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الدعم — نسق</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="js/nasaq-config.js"></script><script src="js/support-common.js"></script></head>
<body><div id="app" style="padding:16px;max-width:1300px;margin:auto"></div>
<script>
const app=document.getElementById('app');
Nosoq.login(app,r=>r==='support'||r==='admin',role=>{
 app.innerHTML=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><h2 style="margin:0">🎧 لوحة الدعم</h2><span class="pill">${role==='admin'?'مدير':'دعم'}</span><button class="btn g s" style="margin-right:auto" id="lo">خروج</button></div><div id="m"></div>`;
 document.getElementById('lo').onclick=async()=>{await Nosoq.sb.auth.signOut();location.reload()};
 Nosoq.mountSupport(document.getElementById('m'),'support');});
</script></body></html>
