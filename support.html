<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12294a"><title>لوحة الدعم — نسق</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="js/nasaq-config.js"></script><script src="js/support-common.js"></script>
<style>#app{padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:1300px;margin:auto}
.sp-top{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:14px 16px;background:#12294a;color:#fff;border-radius:18px}.sp-top h2{margin:0;font-size:18px;flex:1}.sp-top .pill{background:rgba(255,255,255,.16);color:#fff}.sp-top .btn.g{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}</style></head>
<body><div id="app"></div>
<script>
const app=document.getElementById('app');
Nosoq.login(app,r=>r==='support'||r==='admin',role=>{
 app.innerHTML=`<div class="sp-top"><h2>🎧 لوحة الدعم</h2><span class="pill">${role==='admin'?'مدير':'دعم'}</span><button class="btn g s" id="lo">خروج</button></div><div id="m"></div>`;
 document.getElementById('lo').onclick=async()=>{await Nosoq.sb.auth.signOut();location.reload()};
 Nosoq.mountSupport(document.getElementById('m'),'support');});
</script></body></html>
