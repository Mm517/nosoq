<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>المنتج | نَسَق</title>
  <meta name="description" content="تفاصيل المنتج من متجر نَسَق.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2315171c'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%232f45d4'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">

  <!-- schema.org Product + BreadcrumbList + og:* + canonical تُحقن ديناميكياً من js/product-page.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/nasaq-config.js"></script>
  <script src="js/api-shim.js"></script>
  <script defer src="js/cloud.js"></script>
  <script defer src="js/demo-products.js"></script>
  <script defer src="js/products.js"></script>
  <script defer src="js/market.js"></script>
  <script defer src="js/cart.js"></script>
  <script defer src="js/i18n.js"></script>
  <script defer src="js/geo.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/product-page.js"></script>
</head>
<body data-page="product">
  <header id="site-header" class="site-header"></header>

  <main id="main" tabindex="-1">
    <div class="container" id="product-root" aria-busy="true">
      <!-- Skeleton يظهر حتى تجهز الصفحة -->
      <div class="pdp-skeleton" aria-hidden="true">
        <div class="skeleton pdp-skeleton__img"></div>
        <div class="pdp-skeleton__info">
          <div class="skeleton skeleton--line" style="width:30%"></div>
          <div class="skeleton" style="height:38px;width:80%"></div>
          <div class="skeleton skeleton--line" style="width:40%"></div>
          <div class="skeleton" style="height:30px;width:35%"></div>
          <div class="skeleton" style="height:90px"></div>
          <div class="skeleton" style="height:54px"></div>
        </div>
      </div>
      <noscript><p style="padding:2rem 0">يحتاج عرض المنتج إلى تفعيل JavaScript.</p></noscript>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
