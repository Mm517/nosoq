<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>كل المنتجات | نَسَق</title>
  <meta name="description" content="تصفّح ملابس وحقائب وأحذية وإكسسوارات نَسَق. ابحث ورتّب وصفِّ حسب الفئة والسعر.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2315171c'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%232f45d4'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/nasaq-config.js"></script>
  <script src="js/api-shim.js"></script>
  <script defer src="js/cloud.js"></script>
  <script defer src="js/demo-products.js"></script>
  <script defer src="js/products.js"></script>
  <script defer src="js/market.js"></script>
  <script defer src="js/cart.js"></script>
  <script defer src="js/i18n.js"></script>
  <script defer src="js/geo.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/shop.js"></script>
</head>
<body data-page="shop">
  <header id="site-header" class="site-header"></header>
  <noscript><p style="padding:1rem;text-align:center">يحتاج المتجر إلى تفعيل JavaScript لعرض المنتجات وإدارة السلة.</p></noscript>

  <main id="main" tabindex="-1">
    <div class="container">
      <div class="page-head">
        <nav class="breadcrumb" aria-label="مسار التنقل">
          <ol>
            <li><a href="index.html">الرئيسية</a></li>
            <li><span id="shop-crumb" aria-current="page">كل المنتجات</span></li>
          </ol>
        </nav>
        <h1 id="shop-title">كل المنتجات</h1>
      </div>

      <div id="ad-slot"></div>

      <div class="shop">
        <aside class="filters" id="filters" aria-label="تصفية المنتجات">
          <div class="filters__group">
            <h2 class="filters__title">الفئة</h2>
            <ul id="cat-list"></ul>
          </div>

          <div class="filters__group">
            <h2 class="filters__title" id="price-title">السعر (ج.م)</h2>
            <div class="price-range" role="group" aria-labelledby="price-title">
              <div class="field">
                <label for="price-min" class="sr-only">أقل سعر</label>
                <input class="input" id="price-min" type="text" inputmode="numeric" placeholder="من" autocomplete="off">
              </div>
              <div class="field">
                <label for="price-max" class="sr-only">أعلى سعر</label>
                <input class="input" id="price-max" type="text" inputmode="numeric" placeholder="إلى" autocomplete="off">
              </div>
            </div>
          </div>

          <div class="filters__group">
            <h2 class="filters__title">العرض</h2>
            <label class="check"><input type="checkbox" id="only-stock"><span>المتوفر فقط</span></label>
            <label class="check"><input type="checkbox" id="only-sale"><span>العروض فقط</span></label>
          </div>

          <button type="button" class="btn btn--ghost btn--sm" id="reset-filters">إعادة ضبط الفلاتر</button>
        </aside>

        <section aria-label="نتائج المنتجات">
          <div class="toolbar">
            <button type="button" class="btn btn--ghost btn--sm filters-toggle" id="filters-toggle" aria-expanded="false" aria-controls="filters">
              <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-filter"></use></svg>الفلاتر
            </button>
            <div class="field toolbar__search">
              <label for="search-input" class="sr-only">ابحث في المنتجات</label>
              <input class="input" id="search-input" type="search" placeholder="ابحث في المنتجات…" autocomplete="off">
            </div>
            <div class="toolbar__sort">
              <label for="sort-select">الترتيب</label>
              <select class="select" id="sort-select">
                <option value="featured">الأكثر رواجاً</option>
                <option value="new">الأحدث</option>
                <option value="price-asc">السعر: من الأقل</option>
                <option value="price-desc">السعر: من الأعلى</option>
                <option value="rating">الأعلى تقييماً</option>
                <option value="discount">الأكبر خصماً</option>
              </select>
            </div>
          </div>

          <div class="active-filters" id="active-filters" hidden></div>
          <p class="result-count" id="result-count" role="status" aria-live="polite"></p>
          <div class="grid" id="product-grid" aria-busy="true"></div>
        </section>
      </div>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
